<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Chassis -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
  
  <!-- Subtle Keypad Grid Lines in background -->
  <rect x="76" y="80" width="360" height="352" rx="44" fill="#0b0f19" fill-opacity="0.6" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  
  <!-- Subtle Bengali Glyphs "ক" and Keyboard indicator -->
  <text x="256" y="275" font-family="'Noto Sans Bengali', 'Hind Siliguri', sans-serif" font-weight="700" font-size="160" text-anchor="middle" fill="url(#accentGrad)" filter="url(#subtleGlow)">ক</text>
  
  <!-- Spacebar / Minimal Bottom Line -->
  <rect x="156" y="348" width="200" height="14" rx="7" fill="url(#accentGrad)" opacity="0.85"/>
  <circle cx="216" cy="385" r="4" fill="#38bdf8" opacity="0.6"/>
  <circle cx="256" cy="385" r="4" fill="#818cf8" opacity="0.9"/>
  <circle cx="296" cy="385" r="4" fill="#38bdf8" opacity="0.6"/>
</svg>
